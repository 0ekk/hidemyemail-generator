name: Container image

# The only workflow that publishes anything. Release builds of the macOS app and
# the Windows binary are manual-only (see release.yml).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Test
        env:
          PYTHONPATH: src
        run: |
          uv run --frozen pytest -q
          uv run --frozen ruff check

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Single-arch build first so the image can actually be started. A venv
      # that resolves only inside the build stage, or a missing static asset,
      # passes every unit test and fails on the first container start.
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke/data /tmp/smoke/secret
          printf 'X-APPLE-WEBAUTH-USER="v=1:s=0:d=1"\n' > /tmp/smoke/secret/cookies.txt
          chmod -R 777 /tmp/smoke/data
          docker run -d --name smoke -p 8765:8765 \
            --read-only --cap-drop ALL --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -e HIDEMYEMAIL_WEBUI_TOKEN=smoke-token \
            -v /tmp/smoke/data:/data \
            -v /tmp/smoke/secret:/etc/hidemyemail:ro \
            "${IMAGE}:smoke-test"

          for _ in $(seq 30); do
            if curl -fsS http://127.0.0.1:8765/healthz > /dev/null; then break; fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8765/healthz
          # The page itself, and a write that has to reach the mounted volume.
          curl -fsS -o /dev/null "http://127.0.0.1:8765/?token=smoke-token"
          curl -fsS -X POST "http://127.0.0.1:8765/api/batches?token=smoke-token" \
            -H 'Content-Type: application/json' \
            -d '{"label":"smoke","target":1}' > /dev/null
          test -s /tmp/smoke/data/hidemyemail.db

          # The token was supplied, so it must not have been logged.
          ! docker logs smoke 2>&1 | grep -q smoke-token

          docker rm -f smoke > /dev/null

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
