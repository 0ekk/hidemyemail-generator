# Example only — do not commit a filled-in copy. Prefer creating the Secret with
# kubectl (see README.md) so a live iCloud session never reaches the repository.
apiVersion: v1
kind: Secret
metadata:
  name: hidemyemail
  namespace: hidemyemail
type: Opaque
stringData:
  # Anyone with this token controls the account behind the cookie.
  # Generate one with: openssl rand -hex 24
  webui-token: replace-me
  # The iCloud session is not here: it lives on the volume so the Overview
  # panel can replace it. Paste it there after the first rollout.
