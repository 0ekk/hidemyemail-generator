# Port 80 lands on the web UI: the server serves the page at "/", so the
# service address alone is the whole entry point.
apiVersion: v1
kind: Service
metadata:
  name: hidemyemail
  labels:
    app.kubernetes.io/name: hidemyemail
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hidemyemail
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
